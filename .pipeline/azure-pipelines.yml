# .pipeline/azure-pipelines.yml — Backend (Node.js/Express) — repo "scentia-back"
# Org: jvaronm | Proyecto: Jhosep_scentia
# Corre en agente self-hosted Windows (pool "mi-pc-agent").
#
# Antes de correrlo:
#   1. Crea el Azure App Service (Web App) con runtime Node.js.
#   2. Reemplaza 'TU-APP-SERVICE-BACKEND' con el nombre real de tu Web App.
#   3. Nota: el vercel.json que tienes en este repo no se usa aquí — este
#      pipeline despliega directo a Azure App Service, no a Vercel.

trigger:
  branches:
    include:
      - main

pool:
  name: 'mi-pc-agent'

variables:
  azureSubscription: 'scentia-azure-conn'
  webAppName: 'TU-APP-SERVICE-BACKEND'
  nodeVersion: '20.x'

stages:
  - stage: Build
    displayName: 'Build backend'
    jobs:
      - job: Build
        displayName: 'Instalar dependencias y compilar'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Instalar Node.js $(nodeVersion)'

          - script: |
              npm ci
            displayName: 'npm ci'

          - script: |
              npm run build --if-present
            displayName: 'npm run build (si existe)'

          # Excluye node_modules de dev y deja solo lo necesario para producción
          - script: |
              npm prune --production
            displayName: 'Prune dependencias de desarrollo'

          - task: ArchiveFiles@2
            displayName: 'Empaquetar en zip'
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/backend-$(Build.BuildId).zip'
              replaceExistingArchive: true

          - publish: '$(Build.ArtifactStagingDirectory)/backend-$(Build.BuildId).zip'
            artifact: backend-drop

  - stage: Deploy
    displayName: 'Deploy backend a Azure App Service'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: Deploy
        displayName: 'Deploy a $(webAppName)'
        environment: 'scentia-hunter-backend'
        pool:
          name: 'mi-pc-agent'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy Azure Web App'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: 'webAppLinux'
                    appName: $(webAppName)
                    package: '$(Pipeline.Workspace)/backend-drop/backend-$(Build.BuildId).zip'
                    runtimeStack: 'NODE|20-lts'
                    startUpCommand: 'npm start'